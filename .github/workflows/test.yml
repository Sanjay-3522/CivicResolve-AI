name: CivicResolve CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff, mypy, pytest (≥90% coverage), pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff check + ruff format --check)
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        working-directory: backend
        run: mypy .
      - name: Tests with coverage gate
        working-directory: backend
        run: pytest -v --cov --cov-fail-under=90 --cov-report=term-missing --cov-report=xml
      - name: Dependency audit (pip-audit, reviewed exceptions in security/pip-audit-ignore.txt)
        run: bash security/run-pip-audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — ESLint+jsx-a11y, Prettier, tsc, Jest (≥80% coverage), build, npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint (next lint --max-warnings 0 + prettier --check)
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Jest with coverage gate (jest.config.js coverageThreshold = 80%)
        working-directory: frontend
        run: npm run test:coverage
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Audit policy self-test
        run: node security/test-npm-audit.mjs
      - name: Dependency audit (high/critical; reviewed exceptions in security/npm-audit-allowlist.json)
        run: bash security/run-npm-audit.sh

  e2e:
    name: Playwright E2E (happy path, keyboard-only, touch targets)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Build and run E2E against the production build
        working-directory: frontend
        run: npm run build && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: civicresolve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name cr -p 8080:8080 -e ADMIN_API_KEY=ci-smoke-test-key-123456 civicresolve:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS localhost:8080/health | grep '"status":"ok"'
          curl -fsS -o /dev/null localhost:8080/
          curl -fsS -H 'Content-Type: application/json' -d '{"key":"ci-smoke-test-key-123456"}' localhost:8080/api/admin/login
          docker logs cr
